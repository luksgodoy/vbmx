<header class="topo">
  <div class="marca">VbMx <small id="marca-origem">modelo clássico · <span class="tag-exemplo">faixas de exemplo (fictícias)</span> · faixas de exemplo não tocam</small></div>
  <div class="estado-global">Tocando: <b id="estado-tocando">—</b></div>
</header>
<section class="pastas" id="pastas" aria-label="Pastas da biblioteca"></section>

<main class="tela">
  <div class="decks">
    <div class="deck tocando moldura" data-deck="A"></div>
    <div class="mixer moldura" id="mixer" aria-label="Mixer"></div>
    <div class="deck moldura" data-deck="B"></div>
    <!-- SLOTS dos módulos futuros (VbMxUI.slot(nome), VB-11). Ficam `hidden` e fora dos decks e
         do mixer porque renderDeck/renderMixer reescrevem o innerHTML deles; o módulo que ocupa
         um slot o põe no lugar e tira o `hidden`. -->
    <div data-slot="deck-A-hotcues" hidden></div>
    <div data-slot="deck-A-loops" hidden></div>
    <div data-slot="deck-A-grade" hidden></div>
    <div data-slot="deck-A-avisos" hidden></div>
    <div data-slot="deck-B-hotcues" hidden></div>
    <div data-slot="deck-B-loops" hidden></div>
    <div data-slot="deck-B-grade" hidden></div>
    <div data-slot="deck-B-avisos" hidden></div>
    <!-- stems (js/stems-tela.js): faixa de 4 canais por deck; fica recolhida até o modo ligar -->
    <div data-slot="deck-A-stems" data-stems="A" hidden></div>
    <div data-slot="deck-B-stems" data-stems="B" hidden></div>
    <div data-slot="mixer-medidores" hidden></div>
    <div data-slot="mixer-fone" hidden></div>
    <div data-slot="fx-1" hidden></div>
    <div data-slot="fx-2" hidden></div>
  </div>
  <!-- browser (proposta A): biblioteca + sugestões; embaixo ou à esquerda, por preferência (js/disposicao.js) -->
  <section class="browser" aria-label="Biblioteca e sugestões">
    <div class="biblio" id="biblio"></div>
    <aside class="sugestao" id="sugestao" aria-label="Próximas possíveis"></aside>
  </section>
  <div data-slot="preparacao" hidden></div>
  <div data-slot="historico" hidden></div>
  <div data-slot="gravador" hidden></div>
  <div data-slot="preferencias" hidden></div>
</main>
